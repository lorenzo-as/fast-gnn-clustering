n_epochs: 100
batch_size: 64
optimizer: adam
lr: 5.0e-4
global_clipnorm: 1.0
truncate: energy_desc
normalize_features: true

qmin: 0.01
qmin_reference: 1.0
qmin_schedule:
  type: piecewise
  interpolation: constant
  points:
    - [0, 0.1]
    - [5, 0.01]
    - [10, 1e-4]
beta_stabilizing: soft_q_scaling
beta_term_option: paper
payload:
  huber_delta: 1.0
  quantities:
    - name: log_sum_et
      field: sum_et
      transform: log
      epsilon: 1.0e-6
      weight: 1.0
    - name: eta
      field: eta_energy_weighted
      transform: identity
      weight: 1.0
    - name: phi
      field: phi_energy_weighted
      transform: sin_cos
      weight: 1.0
    - name: z
      field: z_energy_weighted
      transform: scale
      scale: 100.0
      weight: 1.0
loss_weights:
  L_V_attractive: 1.0
  L_V_repulsive: 1.0
  L_beta_sig: 1.0
  L_beta_noise: 0.1
  L_payload: 1.0

save_every: 20
log_components_every: 1
