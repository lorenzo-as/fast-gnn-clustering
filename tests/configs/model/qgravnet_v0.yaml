name: qgravnet_v0
quantized: true
max_vertices: 512

n_blocks: 2
n_neighbours: 8
n_dimensions: 4
n_filters: 8
n_propagate: 8
n_postgn_dense_blocks: 2
output_dim: 8
output_head: oc
output_layout:
  beta:
    index: 0
    activation: sigmoid
  cluster_space:
    start: 1
    dim: 2
  payload:
    start: 3
    dim: 5
distance_metric: l1
neighbour_selector: full

dense_layer_dims:
  input_dense: 8
  post_gn: 16
  postgn_block: 16
  out0: 8
  out1: 8

quantization:
  dense_kernel_quantizer: "quantized_bits(8,0,1,alpha=1.0)"
  dense_bias_quantizer: "quantized_bits(8,0,1,alpha=1.0)"

gravnet_cfg:
  fix_coordinate_space: false

selector_cfg: {}
