n_epochs: 100
batch_size: 64
optimizer: adam
lr: 5.0e-4
global_clipnorm: 1.0
truncate: energy_desc
normalize_features: true

qmin: 1.0e-5
qmin_reference: 1.0e-5
# High qmin early bootstraps the coordinate space and keeps L_V a strong counter-force;
# a very low end (charge ~ atanh(beta)^2) gives sharp cluster separation. Held high through
# the payload warm-in window below, then log-step-decayed to 1e-5 and held for the final ~45 epochs.
qmin_schedule:
  type: piecewise
  interpolation: constant
  points:
    - [0, 0.1]
    - [8, 3e-2]
    - [15, 1e-2]
    - [25, 1e-3]
    - [40, 1e-4]
    - [55, 1e-5]
beta_stabilizing: soft_q_scaling
beta_term_option: paper

# payload is composed from the payload config group (payload@training.payload).
loss_weights:
  L_V_attractive: 25.0
  L_V_repulsive: 5.0
  L_beta_sig:
    type: piecewise
    interpolation: linear
    points:
      - [0, 1.0]
      - [20, 1.0]
      - [40, 3.0]    # ramp up once payload is active; ratio beta:payload stays ~10:1
  L_beta_noise: 0.1
  # Warm-up: hold payload at 0 until beta plateaus (~ep 10-15), then ramp to 0.3 cap.
  # Cap at 0.3 (not 1.0) to keep beta loss dominant even with beta_detach off as fallback.
  L_payload:
    type: piecewise
    interpolation: linear
    points:
      - [0, 0.0]
      - [10, 0.0]
      - [35, 0.3]

save_every: 20
log_components_every: 1
